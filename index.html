<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <button class="btn">LIGHT</button>
    <main class="main">
      <div class="div"></div>
      <div class="div2">
        <div class="div4">
          <h1 class="hor">HOURS</h1>
          <div class="h">
            <h2 class="hour"></h2>
          </div>
        </div>
        <span class="dot"><br /><br />:</span>
        <div class="div5">
          <h1 class="min">MINUTES</h1>
          <div class="m">
            <h2 class="minute"></h2>
          </div>
        </div>
        <span class="dots"
          ><br /><br />
          :</span
        >
        <div class="div6">
          <h1 class="sec">SECONDS</h1>
          <div class="s">
            <h2 class="second"></h2>
          </div>
        </div>
      </div>
      <div class="div3">
        <div class="y">
          <h2 class="year"></h2>
        </div>
        <div class="mo">
          <h2 class="month"></h2>
        </div>
        <div class="d">
          <h2 class="day"></h2>
        </div>
        <div class="wheater">
          <h2 class="temp">23° Tehran</h2>
        </div>
      </div>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
